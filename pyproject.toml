[project]
name = "voice2text"
version = "0.1.0"
description = "Local live captions for Chrome and Brave"
requires-python = ">=3.12,<3.13"
dependencies = ["mlx-whisper>=0.4.3,<0.5", "numpy>=2,<3", "starlette>=0.47,<1", "uvicorn>=0.35,<1", "websockets>=15,<17"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
